<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Sondix">
  <style>
    .ink { stroke: #141414; }
    .track { fill: #E4E7EA; }
    .value { fill: #0E6E6E; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #EDEFF1; }
      .track { fill: #2E3236; }
      .value { fill: #5CBDBD; }
    }
  </style>
  <rect class="track" x="10" y="26" width="28" height="12"/>
  <rect class="value" x="10" y="26" width="19" height="12"/>
  <rect class="ink" x="3" y="3" width="42" height="42" fill="none" stroke-width="4"/>
</svg>
