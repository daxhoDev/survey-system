# Local PostgreSQL for development and tests (not for production).
# Databases: survey_system (DATABASE_URL) and survey_system_test (TEST_DATABASE_URL).
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: survey_system
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d survey_system"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
